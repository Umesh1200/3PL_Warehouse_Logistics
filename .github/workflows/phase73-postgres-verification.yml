name: Phase 7.3 PostgreSQL verification

on:
  push:
    branches: [feature/phase-7-enterprise-frontend]
  workflow_dispatch:

jobs:
  dotnet-tests:
    name: .NET Unit & Security Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run full .NET test suite
        run: dotnet test tests/Warehouse3PL.UnitTests/Warehouse3PL.UnitTests.csproj --configuration Release --logger "trx;LogFileName=Warehouse3PL.UnitTests.trx" --results-directory TestResults
      - name: Upload .NET test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Warehouse3PL-UnitTests-trx
          path: TestResults/Warehouse3PL.UnitTests.trx

  rollback-retry:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PHASE73_POSTGRES_CONNECTION: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgrespassword
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project tests/verification/Phase73PostgresCheck/Phase73PostgresCheck.csproj --configuration Release

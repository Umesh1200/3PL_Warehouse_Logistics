<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="topGrad" x1="50" y1="8" x2="50" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6b6eff" />
      <stop offset="100%" stop-color="#5254e6" />
    </linearGradient>
    <linearGradient id="leftGrad" x1="12" y1="28" x2="50" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="rightGrad" x1="50" y1="48" x2="88" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Hexagon Outer Shape -->
  <g filter="url(#shadow)">
    <!-- Top Face -->
    <path d="M 50 10 L 86 31 L 50 51 L 14 31 Z" fill="url(#topGrad)" />
    <!-- Left Face -->
    <path d="M 14 31 L 50 51 L 50 90 L 14 70 Z" fill="url(#leftGrad)" />
    <!-- Right Face -->
    <path d="M 50 51 L 86 31 L 86 70 L 50 90 Z" fill="url(#rightGrad)" />

    <!-- High-Tech Arrow Overlays / Velocity Vectors -->
    <path d="M 50 20 L 72 32 L 50 44 L 28 32 Z" fill="#ffffff" fill-opacity="0.22" />
    <path d="M 50 56 L 76 41 L 76 68 L 50 83 Z" fill="#ffffff" fill-opacity="0.12" />
    <circle cx="50" cy="51" r="3.5" fill="#38bdf8" />
  </g>
</svg>
